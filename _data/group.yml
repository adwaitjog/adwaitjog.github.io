# Research directions shown on group.html. icon: chip | shield | gauge | bolt (see _includes/icon.html).
# A paper is {label, url}. To show related papers on one line, use refs: [{text, url}, ...] (joined with "and").
thrusts:
  - title: GPU and Multi-GPU Architecture
    icon: chip
    text: Memory hierarchies, caches, interconnects, and bandwidth management for GPUs and multi-GPU systems.
    papers:
      - {label: "NetCrafter (ISCA 2025)", url: "https://doi.org/10.1145/3695053.3731040"}
      - {label: "DLRM Inference on GPUs (MICRO 2024)", url: "https://doi.org/10.1109/micro61859.2024.00091"}
      - {label: "Decoupled L1 Caches (HPCA 2021)", url: "docs/pdf/decoupledl1-hpca21.pdf"}
      - {label: "Multi-Application Bandwidth Management (HPCA 2018)", url: "docs/pdf/pbs-hpca18.pdf"}
  - title: Secure and Reliable GPU Computing
    icon: shield
    text: Confidential computing, timing side channels, and resilience to soft errors in GPU-based systems.
    papers:
      - {label: "LÆGIS: Addressing Overheads of GPU Confidential Computing (ISCA 2026)", url: "https://doi.org/10.1109/isca66397.2026.00046"}
      - {label: "Characterizing Confidential Computing Overheads (ISPASS 2025)", url: "https://doi.org/10.1109/ispass64960.2025.00020"}
      - {label: "Data-centric Reliability (DSN 2021)", url: "docs/pdf/kadam-gpu-reliability-dsn21.pdf"}
      - refs:
          - {text: "Randomized Coalescing (HPCA 2018)", url: "docs/pdf/rcoal-hpca18.pdf"}
          - {text: "Bucketing-based Coalescing (HPCA 2020)", url: "docs/pdf/bcoal-hpca20.pdf"}
  - title: Performance Modeling and Simulation
    icon: gauge
    text: Fast, accurate prediction and simulation of AI workloads on GPUs, multi-GPU systems, and emerging hardware.
    papers:
      - {label: "Hibiscus (ISPASS 2026)", url: "https://doi.org/10.1109/ispass69572.2026.00028"}
      - {label: "TrioSim (ISCA 2025)", url: "https://doi.org/10.1145/3695053.3731082"}
      - {label: "Path Forward Beyond Simulators (MICRO 2023)", url: "https://doi.org/10.1145/3613424.3614277"}
  - title: Accelerating Emerging Workloads
    icon: bolt
    text: Architectural and system support for automata processing and other emerging applications on GPUs and accelerators.
    papers:
      - {label: "Asynchronous Automata Processing (SIGMETRICS 2023)", url: "https://doi.org/10.1145/3579453"}
      - {label: "NFAs on GPUs (ASPLOS 2020)", url: "https://par.nsf.gov/servlets/purl/10206640"}
      - {label: "Large-Scale Automata Processing (MICRO 2018)", url: "docs/pdf/hotcoldap-micro18.pdf"}
